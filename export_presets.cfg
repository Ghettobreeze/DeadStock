html/head_include="<script>(function(){var N=String.fromCharCode(10),L=[],lost=false,shown=false;function cap(k){var o=console[k];console[k]=function(){try{L.push(k[0]+': '+Array.prototype.join.call(arguments,' ').slice(0,160));if(L.length>14)L.shift()}catch(e){}return o.apply(console,arguments)}}['log','warn','error'].forEach(cap);window.addEventListener('error',function(e){L.push('E: '+e.message)});var oa=window.alert;window.alert=function(m){if(String(m).indexOf('context lost')>=0){onLost();return}return oa.apply(window,arguments)};function gpu(){try{var g=document.createElement('canvas').getContext('webgl2');var x=g&&g.getExtension('WEBGL_debug_renderer_info');return g?(x?g.getParameter(x.UNMASKED_RENDERER_WEBGL):'webgl2 ok'):'NO webgl2'}catch(e){return '?'}}document.addEventListener('visibilitychange',function(){L.push(document.hidden?'-- left the tab':'-- came back');if(lost&&!document.hidden)location.reload()});function onLost(){lost=true;if(document.hidden)return;if(shown)return;shown=true;var c=document.querySelector('canvas')||{width:0,height:0};var d=document.createElement('div');d.id='ds-lost';d.style.cssText='position:fixed;inset:0;z-index:9999;background:#1a1f1a;color:#fff;overflow:auto;font:16px sans-serif;padding:20px';var b=document.createElement('div');b.style.cssText='text-align:center;font-size:22px;padding:20px;border:2px solid #fc6;margin-bottom:14px';b.textContent='Your browser reset the graphics. TAP HERE TO RELOAD (your day is saved)';b.onclick=function(){location.reload()};var t=document.createElement('p');t.style.fontSize='13px';t.textContent='If reloading does not fix it: close this tab completely and open the game in a new tab (Safari can block graphics in a tab after a few resets). If it happens while you are playing, screenshot this for the dev:';var p=document.createElement('pre');p.style.cssText='white-space:pre-wrap;font-size:11px;color:#cfc';p.textContent='UA: '+navigator.userAgent+N+'GPU: '+gpu()+N+'screen: '+screen.width+'x'+screen.height+' dpr '+devicePixelRatio+N+'canvas: '+c.width+'x'+c.height+N+'--- last log ---'+N+L.join(N);d.appendChild(b);d.appendChild(t);d.appendChild(p);document.body.appendChild(d)}document.addEventListener('DOMContentLoaded',function(){var c=document.querySelector('canvas');if(c)c.addEventListener('webglcontextlost',function(e){e.preventDefault();onLost()},false)})})()</script>"
