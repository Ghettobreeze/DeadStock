[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>document.addEventListener('DOMContentLoaded',function(){var c=document.querySelector('canvas');if(!c)return;c.addEventListener('webglcontextlost',function(e){e.preventDefault();if(document.getElementById('ds-lost'))return;var d=document.createElement('div');d.id='ds-lost';d.style.cssText='position:fixed;inset:0;z-index:9999;background:#1a1f1a;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font:20px sans-serif;padding:24px';d.innerHTML='Your browser reset the graphics.<br><br><b>Tap to reload</b><br><br><small>Tip: close other tabs/apps if this keeps happening.</small>';d.onclick=function(){location.reload()};document.body.appendChild(d)},false)})</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
